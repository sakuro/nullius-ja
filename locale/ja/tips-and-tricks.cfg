[tips-and-tricks-item-description]
nullius-geology-1=不毛な惑星に着陸したばかりです。着陸の際に装備の一部が損傷しましたが、残骸からは研究所を回収できるはずです。\n\nこの惑星について、あなたはまだ何も知りません。まずは現地の環境を分析する必要があります。回収した [entity=nullius-lab-1] と [entity=nullius-solar-panel-1] を設置し、[technology=nullius-geology-1] の研究を開始してください。この最初の研究にサイエンスパックは不要で、電力の供給された研究所さえあれば進められます。
nullius-chlorine=[fluid=nullius-chlorine] と [item=nullius-sodium-hydroxide] の生産と消費のバランスを取ることは、工場にとって継続的な課題になります。どちらも [fluid=nullius-saline] や [fluid=nullius-brine] を電気分解する際に生産されます。初期の工場にはどちらも廃棄する手段がないため、生産した余剰分は貯蔵しておかなければなりません。\n\n研究が済めば、[item=nullius-sodium-hydroxide] は [recipe=nullius-saline-caustic-solution] で溶かすことができ、余った苛性アルカリ溶液は [entity=nullius-outfall-1] で廃棄できます。\n\n研究が済めば、[fluid=nullius-chlorine] は [recipe=nullius-dust-disposal-1] で不活性化してから安全に処分できます。研究を進めるにつれて、より優れた塩素の処分方法が解禁されます。

nullius-power=着陸した直後は、発電と蓄電の手段が残骸から回収できる [item=nullius-solar-panel-1] と [item=nullius-grid-battery-1] に限られます。\n\n工場が成長するにつれて、より多くの発電手段と蓄電手段を建設できるようになります。
nullius-priority=[item=nullius-electrolyzer-1]、[item=nullius-compressor-1]、[item=nullius-turbine-open-1]、[item=nullius-turbine-closed-1] には、電力の消費や生産の仕方を変える複数の優先モードがあります。__CONTROL__nullius-prioritize__ でエンティティの優先モードを順に切り替えられます。\n\n[font=heading-1]優先モードと調圧モードの消費装置[/font]\n\n電解槽とコンプレッサーには、[font=default-bold]優先[/font]と[font=default-bold]調圧[/font]という2種類の電力消費モードがあります。\n\n[font=default-bold]優先[/font]モードの消費装置は、電力網の生産量が需要全体を満たせない場合でも常に稼働します。これは工場のほとんどのエンティティと同じ優先度です。\n\n[font=default-bold]調圧[/font]モードの消費装置は、すべての優先モードの消費装置に電力が行き渡った上で電力網に余剰の生産量がある場合にのみ、電力を引き出します。\n\n[font=heading-1]標準・排気・予備タービン[/font]\n\n開放タービンと密閉タービンには、[font=default-bold]標準[/font]・[font=default-bold]排気[/font]・[font=default-bold]予備[/font]という3種類の優先モードがあります。\n\n[font=default-bold]排気[/font]タービンは、入力された流体を常に可能な限り速く処理します。生成された電力は優先的に電力網へ供給されますが、その時点の電力需要を超えて生成された分は失われます。余剰の蒸気や圧縮ガスを廃棄しつつ、その過程で一部のエネルギーを回収するのに適しています。太陽光や風力といった再生可能エネルギーもこの生産区分に含まれます。\n\n[font=default-bold]標準[/font]タービンは、前の生産区分の後に入力された流体を処理して発電し、すべての電力消費装置が満たされるまでしか稼働しません。主力の発電所に適しています。電力の生産可能量に比べて需要が少ない場合は、流体の処理速度を落とします。\n\n[font=default-bold]予備[/font]タービンは最も優先度の低い発電装置です。前のすべての発電区分で現在の電力需要を満たせなかった場合にのみ、入力された流体を処理して発電します。貯蔵した蒸気や圧縮ガスを放出する、エネルギー貯蔵の一形態として適しています。電力網用バッテリーもこの生産区分に含まれます。
nullius-hydrogen-battery=余剰電力を使って [entity=nullius-surge-electrolyzer-1] で [fluid=nullius-water] を分解すると、[fluid=nullius-hydrogen] と [fluid=nullius-oxygen] が得られます。これらは [entity=nullius-combustion-chamber-1] で結合させて [fluid=nullius-steam] を生産できます。この蒸気を [entity=nullius-turbine-open-backup-1] や [entity=nullius-turbine-closed-backup-1] で放出すれば、発電量が少ない時間帯に電力を得られます。\n\n[item=nullius-electrolyzer-1] は __CONTROL__nullius-prioritize__ で調圧モードに切り替えることで、余剰の発電量があるときだけ稼働するように設定できます。\n\n[item=nullius-turbine-open-1] と [item=nullius-turbine-closed-1] は __CONTROL__nullius-prioritize__ で標準・排気・予備のいずれかのモードに設定できます。標準モードのタービンは、他の発電手段と同じ優先度で発電します。排気モードのタービンは入力ガスがあれば常に稼働し、消費されずに余った電力は捨てられます。予備モードのタービンは、標準モードと排気モードのタービンの発電量が不足しているときにのみ稼働します。
nullius-compressed-nitrogen-battery=余剰電力を使って [entity=nullius-surge-compressor-1] で [fluid=nullius-nitrogen] を圧縮できます。基礎的な発電量が需要を下回ったら、[fluid=nullius-compressed-nitrogen] を [entity=nullius-turbine-closed-backup-2] で減圧し、圧縮に使った電力の大部分を回収できます。\n\nこれは [tip=nullius-hydrogen-battery] と同じ考え方で、分解した [fluid=nullius-hydrogen] と [fluid=nullius-oxygen] の代わりに [fluid=nullius-compressed-nitrogen] に電力を蓄えます。\n\n圧縮ガスの種類によって蓄えられるエネルギー量は異なります。これは圧縮ガス1単位あたり、ひいてはタンク1基あたりのエネルギー貯蔵量に影響します。[fluid=nullius-nitrogen] は大量に入手しやすく、ほとんどが廃棄物であるため、圧縮ガスによるエネルギー貯蔵の手始めとして分かりやすい選択肢です。利用できる圧縮ガスの中で最もエネルギー密度が高いわけではなく、工場が発展するにつれてさらに多くの圧縮ガスが利用できるようになります。
nullius-solar-thermal-power=[item=nullius-solar-collector-1] は太陽の熱を吸収します。この熱で水を沸かし、電力を生み出せます。太陽熱収集器は夜に入っても熱の一部を保持するため、わずかながら電力貯蔵の役割も果たします。太陽熱収集器は隣接する収集器1台につき効率が10%上昇するため、まとめて密集配置すると1台あたりの熱の出力が増えます。
nullius-heat=[font=heading-1]熱の生産[/font]\n\n[item=nullius-solar-collector-1] は日中の太陽エネルギーを熱に変換します。[item=nullius-geothermal-plant-1] は [entity=nullius-fumarole] の上に建設し、[fluid=nullius-volcanic-gas] を枯渇させることなく一定量の熱を生産します。[item=nullius-reactor] は核燃料を消費して熱を出力します。\n\n[font=heading-1]熱の消費[/font]\n\n熱の使い道は2通りあります。[item=nullius-heat-exchanger-1] で [fluid=nullius-steam] を生産するか、[item=nullius-stirling-engine-1] を駆動して直接発電するかです。蒸気はタービンでスターリング機関より効率よく電力に変えられますが、その分だけ構成が複雑になります。熱交換器の蒸気は、より電力効率の高い [recipe=nullius-steam-electrolysis] のような工業プロセスの動力にも使えます。\n\n[font=heading-1]熱の貯蔵[/font]\n\n熱を生産・消費するエンティティはいずれも、熱の緩衝材となる熱容量をいくらか備えています。[item=nullius-thermal-tank-1] は熱の貯蔵に特化しており、太陽熱収集器の熱をより多く夜間へ持ち越すのに役立ちます。

nullius-plumbing=目標を達成するには、工場で多種多様な流体を生産し、均衡させ、廃棄する必要があります。これらの流体を注意深く管理することが、工場を機能させる上で欠かせません。
nullius-pipe-extents=パイプラインには長さの上限があります。パイプの材質によって最大パイプライン長は異なり、より高度な材質のパイプほど上限が伸びます。複数種類のパイプで構成されたパイプラインの上限は、その中で最も上限の短いパイプのものになります。\n\n上限に達したパイプラインは、ポンプを挟んで流体を送ることで延長できます。補給バルブモードと安全バルブモードのポンプを互いに逆向きに組み合わせれば、双方向の流れも作れます。\n\n中型タンクと大型タンクの上限は同じ階層のパイプより短く、大型タンクが最も短くなります。最大パイプライン長を保つには、タンクをポンプで区切って隔離してください。
nullius-pump-modes=ポンプは __CONTROL__configurable-valves-switch__ で3種類のモードに切り替えて動作させられます。\n\n[font=default-bold]通常[/font]のポンプは、流体レベルに関係なく常に入力側から出力側へ流体を送ります。\n\n[font=default-bold]安全バルブ[/font]モードのポンプは、入力側の流体レベルが80%以上のときだけ流体を送ります。\n\n[font=default-bold]補給バルブ[/font]モードのポンプは、出力側の流体レベルが80%以下のときだけ流体を送ります。\n\n[font=default-bold]一方通行バルブ[/font]モードのポンプは、入力側の流体レベルが出力側より高いときに流体を送ります。閾値はポンプごとに変更できます。

nullius-terraforming=あなたは、銀河の不毛な惑星をテラフォーミングし、星々に生命を広めるために、あなたを生み出した者たちから送り出されたテラフォーミングアンドロイドです。この惑星に着陸した今、現地の環境をテラフォーミングできる工場を築き、原材料から生命を作り出し、任務を引き継ぐ次の世代のテラフォーミングアンドロイドを送り出さなければなりません。
nullius-oxygen-venting=この惑星の大気には遊離した [fluid=nullius-oxygen] がありません。生物が生存でき、やがて繁栄できる水準まで大気中の酸素を増やすことが、テラフォーミングの長期的な目標の一つです。\n\n酸素を新たに製造することはできず、[fluid=nullius-water] や [fluid=nullius-carbon-dioxide] に既に含まれている酸素を、分子を分解して取り出すことしかできません。水1単位を電気分解すると、[fluid=nullius-oxygen] 1単位と [fluid=nullius-hydrogen] 2単位が得られます。酸素を放出すれば大気中の酸素量は増えますが、水素を放出すると大気中の酸素と再結合して水蒸気になるため、酸素量は減ってしまいます。大気中の酸素レベルを確実に高めるには、水素を何らかの工程で消費し、大気に放出されないようにする必要があります。\n\n他のさまざまなガスも、放出すると同じように大気中の酸素と結合し、大気酸素の目標に向けた進捗を一部打ち消します。ガスの種類によって酸素と結合する比率は異なります。[fluid=nullius-hydrogen] 2単位は [fluid=nullius-oxygen] 1単位と結合するため、水素の放出には50%の酸素減少ペナルティがあります。以下のガスを放出すると酸素減少ペナルティが発生します:\n\n[fluid=nullius-volcanic-gas]: 20%\n[fluid=nullius-hydrogen]: 50%\n[fluid=nullius-carbon-monoxide]: 50%\n[fluid=nullius-deuterium]: 50%\n[fluid=nullius-ammonia]: 100%\n[fluid=nullius-methane]: 200%
nullius-land-fill-dumping=埋立地の廃棄処理レシピ [recipe=nullius-dumping-rock]、[recipe=nullius-dumping-dirt]、[recipe=nullius-dumping-sand] を使うと、副産物を大量に自動廃棄できます。テラフォーミングドローンに大量の埋立地を積み込み、テラフォーミングに必要な繊細な環境から遠く離れた惑星の辺境へ送り出して、積荷を投棄させます。埋立地に変換できるものはすべてこの方法で処分できます。一部のドローンは長旅を生き延び、将来再利用するためにロボット部品へと再資源化されます。\n\nこの方法で処分できる副産物には、[item=nullius-box-gravel]、[item=nullius-box-sand]、[item=nullius-box-mineral-dust]、[item=nullius-box-graphite]、[item=nullius-box-plastic]、[item=nullius-box-acid-boric]、[item=nullius-box-cellulose]、[fluid=nullius-chlorine] があります。副産物の一部は投棄する前に加工が必要で、例えば [recipe=nullius-plastic-pyrolysis] の後に [recipe=nullius-carbon-sink] といった工程を使います。

nullius-biology=工場は生命の構成要素を合成できるようになりました。これらの基本となる材料から、現地の環境で繁栄できる新しい生物を作り出せます。
nullius-bootstrapping-biology=[fluid=nullius-amino-acids]、[fluid=nullius-fatty-acids]、[fluid=nullius-nucleotides]、[item=nullius-sugar] という、生命の基本的な構成要素を合成する技術が手に入りました。生物は自らを維持するために必要な生物学的材料を、驚くほど効率よく作り出します。しかし残念ながら、その手段はまだ一つも利用できません。\n\nこれらの構成要素の合成は、時間がかかり、エネルギーも大量に消費する工程です。賢明なアンドロイドは、ただちに小規模な生化学工場を建てて、これらの構成要素を少量ずつ生産し始めるとよいでしょう。時間をかければ、その少量でも自己複製する生命を立ち上げるには十分であり、以後はその生命からより効率よく生物学的構成要素を得られるようになります。
nullius-creating-life=生命はいったん定着すれば自己複製しますが、まずは作り出さなければなりません。惑星のテラフォーミングに必要な生命は、自らの複製に加わる前に、どれもまず合成する必要があります。生物学の研究によって、現地の環境で繁栄する [fluid=nullius-bacteria] の菌株が開発されました。[recipe=nullius-bacteria] で最初のバクテリアの個体群を合成し、それを触媒として [recipe=nullius-bacteria-2] で自己複製するバクテリアのコロニーを立ち上げられます。\n\n新たに作り出す生命はどれも同じ道筋をたどります。まず少数の個体群を合成し、次にその最初の生物を使って自己複製を始めるのです。

name: Lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  format-check:
    runs-on: ubuntu-latest
    env:
      # stylua is a standalone binary; skip building Lua
      MISE_DISABLE_TOOLS: lua

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup mise
      uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5

    - name: Check Lua formatting
      run: mise run format-check

  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install build dependencies for Lua
      run: sudo apt-get update && sudo apt-get install -y libreadline-dev

    - name: Setup mise
      uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5

    - name: Lint Lua code
      run: mise run lint

    - name: Check function doc comments
      run: mise run doc-check

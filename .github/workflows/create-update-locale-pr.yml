name: Create update-locale PR

env:
  MOD_NAME: nullius

on: [workflow_dispatch]
jobs:
  Create-Update-Locale-PR:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # Required for git push (branch creation)
      pull-requests: write # Required for PR creation
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure git and gh CLI
        uses: git-actions/set-user@49fa9362373dabe0bfcbdb5e8d4da08045ebf6f8 # v1

      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4

      - name: Set up dummy Factorio runtime for factorix
        # `factorix mod show` also reports local install status, which requires a
        # Factorio user/data dir even though this job only needs the Portal-side
        # `latest_version` field. Point it at a throwaway runtime with an empty
        # mod-list.json instead of installing Factorio on the runner.
        run: |
          mkdir -p /tmp/factorix-dummy/user_dir/mods
          echo '{}' > /tmp/factorix-dummy/user_dir/mods/mod-list.json
          cat > /tmp/factorix-dummy/config.toml <<'TOML'
          [runtime]
          user_dir = "/tmp/factorix-dummy/user_dir"
          data_dir = "/tmp/factorix-dummy/data_dir"
          TOML
          echo "FACTORIX_CONFIG=/tmp/factorix-dummy/config.toml" >> "$GITHUB_ENV"

      - name: Fetch information about the latest version
        id: latest_version
        run: |
          factorix mod show "${MOD_NAME}" --json
          echo "version=$(factorix mod show "${MOD_NAME}" --json | jq -rM .latest_version)" >> "$GITHUB_OUTPUT"

      - name: Download latest MOD
        env:
          VERSION: ${{ steps.latest_version.outputs.version }}
          FACTORIO_USERNAME: ${{ secrets.FACTORIO_USERNAME }}
          FACTORIO_TOKEN: ${{ secrets.FACTORIO_TOKEN }}
        run: |
          factorix mod download "${MOD_NAME}@${VERSION}"

      - name: Update locale/en files
        env:
          VERSION: ${{ steps.latest_version.outputs.version }}
        run: |
          FILE_NAME="${MOD_NAME}_${VERSION}.zip"
          for file in $(unzip -Z1 "${FILE_NAME}" | grep 'locale/en/.*\.cfg'); do
            unzip -p "${FILE_NAME}" "${file}" | tr -d '\r' > "locale/en/$(basename "${file}")"
          done
          git status -sb

      - name: Create a PR on any changes in locale/en
        env:
          VERSION: ${{ steps.latest_version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH_NAME="update-locale-${MOD_NAME}-${VERSION}"
          [[ -z "$(git status --porcelain=v2 --untracked locale/en)" ]] && exit 0

          # shellcheck disable=SC2094  # rm before the redirect; the open fd reads the old file
          (rm -f info.json && jq -M --arg mod "${MOD_NAME}" --arg ver "${VERSION}" \
            '.dependencies |= map(if (split(" ")[0] == $mod) then ($mod + " >= " + $ver) else . end)' \
            > info.json) < info.json

          git switch -c "${BRANCH_NAME}"
          git add locale/en info.json
          git commit -m ":arrow_up: Update locale/en/*.cfg from ${MOD_NAME}@${VERSION}"
          git push origin "${BRANCH_NAME}"
          gh pr create \
            --title "Update locale for ${MOD_NAME}@${VERSION}" \
            --body "This PR is automatically created by the GitHub Action workflow ${{ github.workflow }}.

          Add Japanese translations for any new or changed keys in \`locale/en\` to \`locale/ja\` before merging."
